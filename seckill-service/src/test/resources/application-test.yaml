spring:
  application:
    name: seckill-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6370

services:
  order:
    url: http://localhost:8003
  product:
    url: http://localhost:8002

seckill:
  rate-limit:
    enabled: true
    max-requests-per-second: 100
  sync:
    interval-ms: 30000

bloomfilter:
  expected-insertions: 1000
  fpp: 0.01
