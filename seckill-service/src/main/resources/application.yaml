server:
  port: 8005

spring:
  application:
    name: seckill-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/ecommerce?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        import-check:
          enabled: false
    sentinel:
      transport:
        dashboard: localhost:8080

sentinel:
  eager: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.seckill.entity
  configuration:
    map-underscore-to-camel-case: true

services:
  order:
    url: ${ORDER_SERVICE_URL:http://localhost:8003}
  product:
    url: ${PRODUCT_SERVICE_URL:http://localhost:8002}

seckill:
  rate-limit:
    enabled: true
    max-requests-per-second: 100
  sync:
    interval-ms: 30000

bloomfilter:
  expected-insertions: 10000
  fpp: 0.01

# ========== SpringDoc OpenAPI 配置 ==========
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
