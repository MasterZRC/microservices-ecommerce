server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: public
      config:
        import-check:
          enabled: false
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8001}
          predicates:
            - Path=/api/user/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8002}
          predicates:
            - Path=/api/product/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8003}
          predicates:
            - Path=/api/order/**
        - id: recommendation-service
          uri: http://ecommerce-recommendation-service:8004
          predicates:
            - Path=/api/recommendation/**
          filters:
            - StripPrefix=0
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8006}
          predicates:
            - Path=/api/admin/**
        - id: admin-service-alert
          uri: ${ADMIN_SERVICE_URL:http://admin-service:8006}
          predicates:
            - Path=/api/alert/**
        - id: agent-service
          uri: ${AGENT_SERVICE_URL:http://agent-service:8011}
          predicates:
            - Path=/api/agent/**
          # SSE 流式：去掉 /api 前缀（agent-service 内部路由是 /agent/...）
          # 同时禁用响应缓冲，确保 token 即时送达
          filters:
            - StripPrefix=1
            - SetResponseHeader=X-Accel-Buffering, no
            - SetResponseHeader=Cache-Control, no-cache
        - id: seckill-service
          uri: ${SECKILL_SERVICE_URL:http://localhost:8005}
          predicates:
            - Path=/api/seckill/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${SECKILL_RATE_LIMIT_REPLENISH:200}
                redis-rate-limiter.burstCapacity: ${SECKILL_RATE_LIMIT_BURST:400}
                redis-rate-limiter.requestedTokens: 1

sentinel:
  transport:
    dashboard: localhost:8080
  eager: true

jwt:
  secret: ${JWT_SECRET:mySecretKeyForEcommerceGraduationProject2024}

logging:
  level:
    org.springframework.cloud.gateway: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 7
      total-size-cap: 1GB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ========== SpringDoc OpenAPI 配置 ==========
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    try-it-out-enabled: true
