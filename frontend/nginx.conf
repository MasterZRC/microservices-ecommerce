# Upstream backend (API Gateway)
upstream backend {
    server api-gateway:8080;
    keepalive 32;
}

# Gzip compression types
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-javascript
    application/xhtml+xml
    application/atom+xml
    application/xslt+xml
    image/svg+xml
    font/opentype
    font/ttf
    font/eot
    font/otf;

server {
    listen 80;
    server_name localhost;
    charset utf-8;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection      "1; mode=block"      always;
    add_header Referrer-Policy       "no-referrer-when-downgrade" always;
    add_header Permissions-Policy    "camera=(), microphone=(), geolocation=()" always;

    # Health check endpoint (used by docker healthcheck)
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA routing: serve index.html for all non-file routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache busting: hashed assets can be cached for 1 year
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|map)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML should not be cached (contains auth state)
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # Agent SSE 流式：禁用缓冲与 gzip，保证 token 即时送达
    location /api/agent/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip off;
        chunked_transfer_encoding on;
    }

    # API proxy to Gateway
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Connection reuse
        proxy_set_header Connection "";

        # Forward client info
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Buffering
        proxy_buffering    on;
        proxy_buffer_size  4k;
        proxy_buffers      8 4k;

        # Error handling
        proxy_intercept_errors off;
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
