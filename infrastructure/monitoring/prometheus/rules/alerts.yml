groups:
  # ==================== 服务可用性告警 ====================
  - name: ecommerce_availability
    rules:
      # 服务宕机告警
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "服务 {{ $labels.job }} 不可用"
          description: "{{ $labels.job }} 已经宕机超过 1 分钟，请立即检查！"
          runbook_url: "https://wiki.ecommerce.com/runbooks/service-down"

      # 服务启动缓慢告警
      - alert: ServiceSlowStart
        expr: up{job!="prometheus"} == 1 and rate(http_server_requests_seconds_count{job=~".*-service"}[5m]) == 0
        for: 5m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "服务 {{ $labels.job }} 无请求"
          description: "{{ $labels.job }} 已有 5 分钟无请求，可能是启动缓慢或已被限流"

  # ==================== 服务性能告警 ====================
  - name: ecommerce_performance
    rules:
      # 服务延迟过高 P95
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "服务 {{ $labels.job }} P95 延迟过高"
          description: "{{ $labels.job }} P95 延迟达到 {{ $value | humanizeDuration }}，超过 2 秒阈值"

      # 服务延迟过高 P99
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "服务 {{ $labels.job }} P99 延迟严重"
          description: "{{ $labels.job }} P99 延迟达到 {{ $value | humanizeDuration }}，超过 5 秒阈值"

      # JVM 堆内存使用率过高
      - alert: HighJvmHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "{{ $labels.job }} JVM 堆内存使用率过高"
          description: "{{ $labels.job }} 堆内存使用率已达到 {{ $value | humanizePercentage }}"

      # JVM 堆内存即将耗尽
      - alert: JvmHeapExhausted
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.95
        for: 1m
        labels:
          severity: critical
          category: performance
        annotations:
          summary: "{{ $labels.job }} JVM 堆内存即将耗尽"
          description: "{{ $labels.job }} 堆内存使用率已达到 {{ $value | humanizePercentage }}，请立即处理！"

      # GC 频繁导致停顿
      - alert: HighGcPause
        expr: rate(jvm_gc_pause_seconds_sum[5m]) > 1
        for: 3m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "{{ $labels.job }} GC 停顿时间过长"
          description: "{{ $labels.job }} GC 停顿速率达到 {{ $value | humanizeDuration }}/s"

  # ==================== 秒杀服务专项告警 ====================
  - name: seckill_alerts
    rules:
      # 秒杀成功率过低
      - alert: SeckillSuccessRateLow
        expr: |
          (
            rate(seckill_requests_success_total[5m])
            /
            (rate(seckill_requests_success_total[5m]) + rate(seckill_requests_failed_total[5m]) + 0.001)
          ) < 0.8
        for: 5m
        labels:
          severity: warning
          category: business
          service: seckill-service
        annotations:
          summary: "秒杀成功率过低"
          description: "秒杀成功率 {{ $value | humanizePercentage }}，低于 80% 阈值，请检查库存和限流配置"

      # 秒杀队列积压严重
      - alert: SeckillQueueBacklog
        expr: seckill_queue_size > 1000
        for: 3m
        labels:
          severity: critical
          category: business
          service: seckill-service
        annotations:
          summary: "秒杀消息队列积压严重"
          description: "秒杀队列积压 {{ $value }} 条消息，可能导致订单创建延迟"

      # 秒杀限流触发频繁
      - alert: SeckillRateLimitHigh
        expr: rate(seckill_rate_limited_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
          category: business
          service: seckill-service
        annotations:
          summary: "秒杀限流触发频繁"
          description: "秒杀限流触发速率为 {{ $value | humanize }} 次/秒，可能存在恶意请求"

      # 秒杀库存耗尽
      - alert: SeckillStockExhausted
        expr: seckill_available_stock == 0
        for: 1m
        labels:
          severity: info
          category: business
          service: seckill-service
        annotations:
          summary: "秒杀商品库存已耗尽"
          description: "秒杀商品库存已全部售出"

      # 秒杀 Lua 脚本执行失败
      - alert: SeckillLuaScriptError
        expr: rate(seckill_lua_script_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          category: business
          service: seckill-service
        annotations:
          summary: "秒杀 Lua 脚本执行失败"
          description: "秒杀 Lua 脚本执行错误，请检查 Redis 连接和脚本逻辑"

  # ==================== 推荐服务专项告警 ====================
  - name: recommendation_alerts
    rules:
      # 推荐服务响应超时
      - alert: RecommendationTimeout
        expr: histogram_quantile(0.99, rate(recommendation_request_duration_seconds_bucket{operation="rank"}[5m])) > 5
        for: 2m
        labels:
          severity: warning
          category: business
          service: recommendation-service
        annotations:
          summary: "推荐排序服务响应超时"
          description: "推荐排序 P99 延迟达到 {{ $value | humanizeDuration }}，超过 5 秒阈值"

      # 推荐服务离线
      - alert: RecommendationServiceDown
        expr: rate(recommendation_requests_total[5m]) == 0 and rate(recommendation_requests_total[1h]) > 0
        for: 5m
        labels:
          severity: critical
          category: business
          service: recommendation-service
        annotations:
          summary: "推荐服务无响应"
          description: "推荐服务 5 分钟内无请求，可能已宕机"

      # 推荐服务降级
      - alert: RecommendationFallback
        expr: rate(recommendation_fallback_total[5m]) / rate(recommendation_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
          service: recommendation-service
        annotations:
          summary: "推荐服务降级比例过高"
          description: "推荐服务降级比例达到 {{ $value | humanizePercentage }}，排序服务可能异常"

      # 推荐结果为空（冷启动问题）
      - alert: RecommendationEmptyResult
        expr: rate(recommendation_empty_results_total[5m]) / rate(recommendation_requests_total[5m]) > 0.3
        for: 10m
        labels:
          severity: warning
          category: business
          service: recommendation-service
        annotations:
          summary: "推荐结果空率过高"
          description: "推荐结果空率达到 {{ $value | humanizePercentage }}，可能是冷启动用户过多"

  # ==================== 订单服务专项告警 ====================
  - name: order_alerts
    rules:
      # 订单创建失败率过高
      - alert: OrderFailureRateHigh
        expr: |
          (
            rate(order_create_failed_total[5m])
            /
            (rate(order_create_success_total[5m]) + rate(order_create_failed_total[5m]) + 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          category: business
          service: order-service
        annotations:
          summary: "订单创建失败率过高"
          description: "订单创建失败率 {{ $value | humanizePercentage }}，超过 5% 阈值"

      # 购物车操作失败
      - alert: CartOperationFailed
        expr: rate(cart_operation_errors_total[5m]) > 5
        for: 3m
        labels:
          severity: warning
          category: business
          service: order-service
        annotations:
          summary: "购物车操作失败频繁"
          description: "购物车操作失败速率为 {{ $value }} 次/秒"

  # ==================== API 网关专项告警 ====================
  - name: gateway_alerts
    rules:
      # 网关 5xx 错误率过高
      - alert: GatewayErrorRateHigh
        expr: |
          (
            rate(http_server_requests_seconds_count{job="api-gateway", status=~"5.."}[5m])
            /
            (rate(http_server_requests_seconds_count{job="api-gateway"}[5m]) + 0.001)
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          category: gateway
        annotations:
          summary: "API 网关 5xx 错误率过高"
          description: "API 网关 5xx 错误率达到 {{ $value | humanizePercentage }}，下游服务可能异常"

      # 网关认证失败过多
      - alert: GatewayAuthFailure
        expr: rate(gateway_auth_failures_total[5m]) > 50
        for: 5m
        labels:
          severity: warning
          category: gateway
        annotations:
          summary: "API 网关认证失败过多"
          description: "认证失败速率为 {{ $value }} 次/秒，可能存在暴力破解"

      # 网关限流触发
      - alert: GatewayRateLimitTriggered
        expr: rate(gateway_rate_limit_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
          category: gateway
        annotations:
          summary: "API 网关限流频繁"
          description: "网关限流触发速率为 {{ $value }} 次/秒"

  # ==================== 数据库告警 ====================
  - name: database_alerts
    rules:
      # 数据库连接池耗尽
      - alert: HikariCPConnectionPoolExhausted
        expr: hikaricp_connections_active{pool="HikariPool-1"} / hikaricp_connections_max{pool="HikariPool-1"} > 0.9
        for: 3m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "{{ $labels.job }} 数据库连接池即将耗尽"
          description: "{{ $labels.job }} 连接池使用率达到 {{ $value | humanizePercentage }}"

  # ==================== AI Agent 告警 ====================
  - name: agent_alerts
    rules:
      # Agent 请求错误率偏高
      - alert: AgentRequestErrorHigh
        expr: |
          (
            rate(agent_requests_total{status="error"}[5m])
            /
            (rate(agent_requests_total[5m]) + 0.001)
          ) > 0.1
        for: 5m
        labels:
          severity: warning
          category: business
          service: agent-service
        annotations:
          summary: "AI Agent 请求错误率过高"
          description: "{{ $labels.channel }} 通道错误率 {{ $value | humanizePercentage }}，超过 10% 阈值，可能是 LLM 限流或工具失败"

      # Agent 响应 P99 延迟过高
      - alert: AgentLatencyP99High
        expr: histogram_quantile(0.99, rate(agent_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          category: business
          service: agent-service
        annotations:
          summary: "AI Agent P99 延迟过高"
          description: "{{ $labels.channel }} 通道 P99 延迟 {{ $value | humanizeDuration }}，超过 30 秒"

      # Token 消耗速率异常（防止恶意刷单导致烧钱）
      - alert: AgentTokenSpendBurst
        expr: rate(agent_tokens_total[5m]) > 5000
        for: 5m
        labels:
          severity: critical
          category: cost
          service: agent-service
        annotations:
          summary: "AI Agent token 消耗速率异常"
          description: "{{ $labels.channel }} 通道 5 分钟内 token 速率 {{ $value | humanize }}/秒，怀疑被刷，请立即检查"

      # 工具调用失败率高
      - alert: AgentToolCallFailureRate
        expr: |
          (
            rate(agent_tool_calls_total{status="error"}[5m])
            /
            (rate(agent_tool_calls_total[5m]) + 0.001)
          ) > 0.2
        for: 3m
        labels:
          severity: warning
          category: business
          service: agent-service
        annotations:
          summary: "AI Agent 工具调用失败率过高"
          description: "工具 {{ $labels.tool }} 失败率 {{ $value | humanizePercentage }}，超过 20%，下游服务可能异常"
